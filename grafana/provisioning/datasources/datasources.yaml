apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://lgtm:9090
    isDefault: true
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://lgtm:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
      serviceMap:
        datasourceUid: prometheus
  - name: Loki
    uid: loki
    type: loki
    url: http://lgtm:3100
