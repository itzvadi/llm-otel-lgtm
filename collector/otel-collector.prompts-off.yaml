# OpenTelemetry Collector - prompt logging OFF (default)
# Prompt/response content is removed even if an app sends it.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}
  filter/drop_content:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["event.name"] == "gen_ai.content"'
  attributes/strip_content:
    actions:
      - { key: gen_ai.prompt, action: delete }
      - { key: gen_ai.completion, action: delete }
      - { pattern: '^gen_ai\.(prompt|completion)\..*', action: delete }

exporters:
  otlp/lgtm:
    endpoint: lgtm:4317
    tls: { insecure: true }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/strip_content, batch]
      exporters: [otlp/lgtm]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/lgtm]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_content, attributes/strip_content, batch]
      exporters: [otlp/lgtm]
