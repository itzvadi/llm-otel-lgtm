name: llm-otel-lgtm

services:
  # Grafana LGTM backends (Loki, Tempo, Prometheus) in one container.
  lgtm:
    image: grafana/otel-lgtm:${LGTM_VERSION:-latest}
    restart: unless-stopped

  # Single entry point for all LLM telemetry.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${COLLECTOR_VERSION:-0.115.0}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      # PROMPT_LOGGING=off (default) drops prompt/response content; on keeps it.
      - ../../collector/otel-collector.prompts-${PROMPT_LOGGING:-off}.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on: [lgtm]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.3.0}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/01-llm-overview.json
    volumes:
      - ../../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [lgtm]
    restart: unless-stopped

  # Optional zero-code gateway:  docker compose --profile gateway up -d
  litellm:
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-main-stable}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: llm-gateway
    volumes:
      - ../../gateway/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on: [otel-collector]

  # Demo traffic (mock mode needs no API keys):  docker compose --profile demo up -d
  demo:
    profiles: ["demo"]
    build: ../../instrumentation/python
    command: ["python", "examples/load_generator.py"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: demo-app
      PROMPT_LOGGING: ${PROMPT_LOGGING:-off}
      LLM_MOCK: ${LLM_MOCK:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    depends_on: [otel-collector]
