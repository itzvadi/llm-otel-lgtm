name: llm-otel-lgtm

services:
  # Grafana LGTM backends (Loki, Tempo, Prometheus) in one container.
  lgtm:
    image: grafana/otel-lgtm:${LGTM_VERSION:-0.40.0}
    environment:
      # Record a zero at each counter's start time, so increase() also counts
      # short-lived processes (CLI agents, scripts) from their very first sample.
      PROMETHEUS_EXTRA_ARGS: --enable-feature=created-timestamp-zero-ingestion
    volumes:
      - lgtm-data:/data   # metrics, logs and traces survive restarts
    restart: unless-stopped

  # Single entry point for all LLM telemetry (your apps, Claude Code, Codex, ...).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${COLLECTOR_VERSION:-0.164.0}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      # PROMPT_LOGGING=off (default) drops prompt/response content; on keeps it.
      - ../../collector/otel-collector.prompts-${PROMPT_LOGGING:-off}.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      lgtm: { condition: service_healthy }
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.3.0}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/llm-observability.json
    volumes:
      - grafana-data:/var/lib/grafana   # dashboard edits saved in the UI survive restarts
      - ../../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      lgtm: { condition: service_healthy }
    restart: unless-stopped

  # Optional zero-code gateway:  docker compose --profile gateway up -d
  litellm:
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-v1.108.2}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Clients send this as their API key. LiteLLM refuses to start without one.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: llm-gateway
    volumes:
      - ../../gateway/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on: [otel-collector]

volumes:
  lgtm-data:
  grafana-data:
