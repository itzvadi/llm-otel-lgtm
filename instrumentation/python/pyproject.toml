[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-telemetry"
version = "0.2.0"
description = "OpenTelemetry traces, metrics and logs for any LLM call (OpenAI, Claude, Grok, Gemini, Ollama, ...)"
requires-python = ">=3.10"
dependencies = [
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "pyyaml>=6",
  "openai>=1.40",       # chat() for OpenAI, xAI and any OpenAI-compatible provider
  "anthropic>=0.39",    # chat() for Claude
]

[tool.setuptools]
packages = ["llm_telemetry"]

[tool.setuptools.package-data]
llm_telemetry = ["pricing.yaml"]
